<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wortkarten</title>
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 布局：手机单栏；平板竖屏单栏放大；平板横屏/电脑左题右解析两栏。der/die/das 用德国课堂惯用的蓝/红/绿。 */
:root {
  --bg: #eef1f4; --card: #ffffff; --ink: #17202c; --muted: #5d6877; --line: #d9dee5; --soft: #f5f7f9;
  --marker: #f3c844; --marker-ink: #3a2d00;
  --der: #2462a6; --die: #c03a2f; --das: #2c8545;
  --ok: #1f7a5c; --bad: #b3362b;
  --f-word: "Literata", Georgia, "Noto Serif", "Songti SC", serif;
  --f-ui: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f141b; --card: #18202a; --ink: #e5e9ef; --muted: #98a3b3; --line: #2a3441; --soft: #1e2833;
  --marker: #e2b93c; --marker-ink: #231a00;
  --der: #74a9e6; --die: #ef7d72; --das: #6ec486; --ok: #5cc49a; --bad: #ee7b70; color-scheme: dark } }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-ui); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 780px; margin: 0 auto;
  padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 14px; }
.brand { font: 600 20px/1 var(--f-word); letter-spacing: .01em; }
.brand span { background: linear-gradient(transparent 58%, var(--marker) 58%); padding: 0 2px; }
nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--muted); }
nav button[aria-current="page"] { color: var(--ink); background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.syncdot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; margin-left: 4px; vertical-align: middle; }
.syncdot.ok { background: var(--ok); } .syncdot.err { background: var(--bad); } .syncdot.busy { background: var(--marker); }

.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.bar b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.bar select { font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.progress i { display: block; height: 100%; background: var(--marker); width: 0; transition: width .3s; }

.stage { display: grid; gap: 14px; }
.side.empty { display: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 26px 26px 22px; min-width: 0; }
.qtype { font: 500 11px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.lv { font-family: var(--f-mono); font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--soft); color: var(--muted); letter-spacing: 0; }
.word { font: 600 clamp(30px, 6vw, 44px)/1.15 var(--f-word); margin: 14px 0 4px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; overflow-wrap: anywhere; }
.word .art { font-weight: 400; font-size: .62em; }
.der { color: var(--der); } .die { color: var(--die); } .das { color: var(--das); }
.play { border: 1px solid var(--line); background: var(--soft); border-radius: 50%; width: 40px; height: 40px; display: inline-grid; place-items: center; flex: none; align-self: center; padding: 0; }
.play svg { width: 18px; height: 18px; fill: var(--ink); }
.prompt { font: 400 22px/1.4 var(--f-ui); margin: 14px 0 6px; }
.hidden-word { color: var(--muted); font: 400 18px var(--f-ui); margin: 18px 0 6px; display: flex; gap: 12px; align-items: center; }
.sub { color: var(--muted); font-size: 14px; min-height: 1.4em; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { text-align: left; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt kbd { font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: none; }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt.de .t { font-family: var(--f-word); font-size: 17px; }
.opt.big { justify-content: center; font: 600 22px var(--f-word); padding: 16px; }
.opt.ok { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.opt.bad { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); opacity: .85; }
.opt:disabled { cursor: default; }
.opt .mark { margin-left: auto; font-weight: 600; }
.opt.ok .mark { color: var(--ok); } .opt.bad .mark { color: var(--bad); }

.detail { display: grid; gap: 12px; }
.d-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.d-word { font: 600 22px var(--f-word); }
.d-zh { font-size: 18px; font-weight: 500; }
.forms { font: 14px var(--f-word); color: var(--muted); }
.forms b { color: var(--ink); font-weight: 600; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.senses { margin: 0; padding-left: 1.4em; }
.ex { display: grid; gap: 2px; }
.ex .de { font: 16px/1.5 var(--f-word); display: flex; gap: 8px; align-items: baseline; }
.ex .de button { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 13px; flex: none; }
.ex .zh { color: var(--muted); font-size: 14px; }
.sect { font: 600 11px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.col { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 14px; }
.col .g { font-family: var(--f-word); }
.col .c { color: var(--muted); }
.tip { background: var(--soft); border-left: 3px solid var(--marker); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 9px 16px; }
.btn.primary { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 500; }
.btn kbd { font: 500 11px var(--f-mono); opacity: .7; margin-left: 6px; }
.btn.ghost { background: none; color: var(--muted); }
.spacer { flex: 1; }
.inline-detail { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 16px; }

.done { text-align: center; padding: 30px 10px; }
.done h2 { font: 600 26px var(--f-word); margin: 0 0 6px; }
.done p { color: var(--muted); margin: 0 0 18px; }

.place-word { font: 600 40px/1.2 var(--f-word); margin: 10px 0; overflow-wrap: anywhere; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.place-zh { color: var(--muted); min-height: 1.6em; font-size: 17px; }
.place-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }

.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.tools input, .tools select { font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.tools input { flex: 1; min-width: 160px; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.row:first-child { border-top: 0; }
.row .w { font: 16px var(--f-word); min-width: 0; overflow-wrap: anywhere; }
.row .m { color: var(--muted); font-size: 14px; min-width: 0; }
.st { font-size: 12px; font-family: var(--f-mono); color: var(--muted); white-space: nowrap; }
.st.learn { color: var(--der); } .st.known { color: var(--das); }
.more { display: block; width: 100%; padding: 12px; border: 0; border-top: 1px solid var(--line); background: var(--soft); color: var(--muted); }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.stat .n { font: 600 28px var(--f-word); font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 13px; }
.tablebox { overflow-x: auto; }
table.lvl { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.lvl th, .lvl td { text-align: right; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.lvl th:first-child, .lvl td:first-child { text-align: left; }
.lvl th { color: var(--muted); font-weight: 500; border-top: 0; }
.fc { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin-top: 8px; }
.fc div { flex: 1; display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.fc i { display: block; width: 100%; max-width: 34px; background: var(--der); border-radius: 3px 3px 0 0; min-height: 2px; }
.settings { display: grid; gap: 14px; }
.settings .card { display: grid; gap: 14px; }
.settings h3 { margin: 0; }
.settings label { display: grid; gap: 4px; font-size: 14px; }
.settings select, .settings input[type=range], .settings input[type=password], .settings input[type=text] { font: inherit; background: var(--soft); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-width: 100%; }
.settings ol { margin: 0; padding-left: 1.3em; font-size: 14px; display: grid; gap: 4px; }
.settings a { color: var(--der); }
.note { color: var(--muted); font-size: 13px; }
.sync { font-size: 13px; color: var(--muted); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
h3 { font: 600 16px var(--f-word); margin: 18px 0 8px; }

@media (max-width: 520px) {
  .card { padding: 20px 16px 18px; }
  .opts, .opts.two { grid-template-columns: 1fr; }
  .opts.three { grid-template-columns: repeat(3, 1fr); }
  .row { grid-template-columns: 1fr auto; } .row .m { grid-column: 1 / -1; }
}
/* 平板竖屏（小新 Pad Pro 12.7 竖着约 920 宽） */
@media (min-width: 760px) {
  .wrap { max-width: 900px; }
  body { font-size: 16px; }
  .word { font-size: 52px; }
  .prompt { font-size: 26px; }
  .opt { font-size: 18px; padding: 16px 18px; }
  .opt.de .t { font-size: 20px; }
  .opt.big { font-size: 28px; padding: 20px; }
  .d-zh { font-size: 20px; }
  .ex .de { font-size: 18px; } .ex .zh, .col, .tip, .forms { font-size: 15px; }
}
/* 平板横屏 / 电脑：左题右解析 */
@media (min-width: 1100px) {
  .wrap { max-width: 1360px; }
  .stage { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; gap: 18px; }
  .side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
  .side.empty { display: block; color: var(--muted); }
  .inline-detail { display: none; }
  .word { font-size: 58px; }
}
@media (max-width: 1099px) { .side { display: none; } }
/* 触屏：放大点按区域，去掉键盘提示 */
@media (pointer: coarse) {
  .opt kbd, .btn kbd, .kbhint { display: none; }
  .opt { min-height: 64px; align-items: center; }
  .btn { padding: 13px 20px; font-size: 16px; }
  .actions .btn.primary { flex: 1 1 220px; padding: 16px; font-size: 18px; }
  .place-btns .btn { padding: 20px; font-size: 18px; }
  nav button { padding: 9px 14px; font-size: 16px; }
  .play { width: 48px; height: 48px; }
  .play svg { width: 22px; height: 22px; }
  .bar select { padding: 6px 8px; }
}
/* 纠错弹窗、更新日志 */
.fbbtn { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 2px 4px; margin-left: auto; text-decoration: underline; text-underline-offset: 3px; }
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 20px; display: grid; gap: 12px; }
.sheet h3 { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
.chips button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--card); }
.sheet textarea, .sheet input { font: inherit; width: 100%; background: var(--soft); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.sheet textarea { min-height: 120px; resize: vertical; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.log { display: grid; gap: 12px; }
.log .card { padding: 16px 20px; }
.log h3 { margin: 0 0 6px; font-size: 15px; }
.log ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.newdot { width: 7px; height: 7px; border-radius: 50%; background: var(--die); display: inline-block; margin-left: 4px; vertical-align: top; }
.row { cursor: pointer; }
.about { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.about a { color: var(--der); }
/* 百词斩式学习：例句选义、拼写、斩、提示、连对、每组小结 */
.sent { font: 400 22px/1.5 var(--f-word); margin: 14px 0 6px; overflow-wrap: anywhere; }
.sent mark { background: linear-gradient(transparent 55%, var(--marker) 55%); color: inherit; font-weight: 600; padding: 0 1px; }
.sent button { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 0 4px; }
.hintbox { margin-top: 14px; background: var(--soft); border-left: 3px solid var(--der); border-radius: 0 6px 6px 0; padding: 8px 12px; font-size: 14px; display: grid; gap: 4px; }
.hintbox .de { font-family: var(--f-word); font-size: 15px; }
.spell { display: grid; gap: 10px; margin-top: 20px; }
.spell .line { display: flex; gap: 10px; align-items: center; }
.spell .art { font: 400 24px var(--f-word); }
.spell input { font: 600 26px var(--f-word); padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); color: var(--ink); width: 100%; min-width: 0; letter-spacing: .02em; }
.spell input.ok { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.spell input.bad { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.umlauts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.umlauts button[data-ch] { font: 500 18px var(--f-word); min-width: 44px; min-height: 40px; padding: 4px 10px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; }
.diff { font: 600 26px var(--f-word); letter-spacing: .03em; }
.diff .x { color: var(--bad); text-decoration: underline; text-underline-offset: 4px; }
.combo b { transition: color .2s; } .combo.t1 b { color: var(--das); } .combo.t2 b { color: var(--der); } .combo.t3 b { color: var(--die); }
.combo.pop { display: inline-block; animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.4); } }
.card.q { position: relative; overflow: hidden; }
.card.killing::after { content: ""; position: absolute; left: -10%; top: 46%; width: 120%; height: 5px; background: var(--die); transform: rotate(-12deg) scaleX(0); transform-origin: left center; animation: slash .3s ease-out forwards; }
.card.killing > * { opacity: .35; transition: opacity .25s; }
@keyframes slash { to { transform: rotate(-12deg) scaleX(1); } }
.autobar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 16px; }
.autobar i { display: block; height: 100%; width: 0; background: var(--ok); animation: fill 1.3s linear forwards; }
@keyframes fill { to { width: 100%; } }
.sum .row { grid-template-columns: 1.6em 1fr 1fr auto; }
.res { font-weight: 600; text-align: center; } .res.ok { color: var(--ok); } .res.bad { color: var(--bad); } .res.kill { color: var(--die); }
.sum.hidezh .m { visibility: hidden; }
.st.kill { color: var(--die); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 60; padding: 12px 18px; max-width: 90vw; box-shadow: 0 6px 24px rgb(0 0 0 / .2); display: flex; align-items: center; gap: 12px; }
.toast .btn { padding: 6px 12px; }
@media (max-width: 520px) { .sum .row { grid-template-columns: 1.6em 1fr auto; } .sum .row .st { grid-row: 1; grid-column: 3; } .sum .row .m { grid-column: 2 / -1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* 语法课、听力 */
.lvtabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.lvtabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; display: inline-flex; gap: 8px; align-items: baseline; }
.lvtabs button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.lvtabs small { font: 500 11px var(--f-mono); opacity: .75; }
.trow { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: baseline; cursor: pointer; }
.trow:first-child { border-top: 0; }
.trow:hover { background: var(--soft); }
.trow .no { font: 500 12px var(--f-mono); color: var(--muted); }
.trow .tt { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.trow .td { grid-column: 2 / -1; font: 14px var(--f-word); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.trow .st.done { color: var(--das); } .trow .st.part { color: var(--der); }
.gsec { font: 600 13px var(--f-ui); color: var(--muted); margin: 18px 0 8px; }
.hero { display: grid; gap: 10px; margin-bottom: 14px; }
.hero .card { padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.hero .card .grow { flex: 1 1 260px; min-width: 0; }
.hero b.big { font: 600 18px var(--f-word); }
.backline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.backline .note { margin-left: auto; }
.lesson { display: grid; gap: 14px; }
.lesson h2 { font: 600 26px/1.25 var(--f-word); margin: 6px 0 2px; }
.lesson .deu { font: 16px var(--f-word); color: var(--muted); margin-bottom: 8px; }
@media (min-width: 1100px) {
  .lesson { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; gap: 18px; }
  .lesson .stick { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
}
.expl { font-size: 15.5px; }
.expl h4 { font: 600 17px var(--f-word); margin: 20px 0 6px; }
.expl p { margin: 8px 0; }
.expl ul { margin: 6px 0; padding-left: 1.3em; display: grid; gap: 3px; }
.expl table { border-collapse: collapse; margin: 8px 0; font-size: 14.5px; background: var(--card); }
.expl th, .expl td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
.expl th { background: var(--soft); font-weight: 500; }
.expl td { font-family: var(--f-word); }

<body>
<div class="wrap">
  <header>
    <div class="brand"><span>Wortkarten</span></div>
    <nav id="nav">
      <button data-v="learn" aria-current="page">单词</button>
      <button data-v="grammar">语法</button>
      <button data-v="listen">听力</button>
      <button data-v="place">摸底</button>
      <button data-v="browse">词库</button>
      <button data-v="stats">统计</button>
      <button data-v="log">更新<span id="logdot"></span></button>
      <button data-v="settings">设置<span class="syncdot" id="dot" title="同步状态"></span></button>
    </nav>
  </header>
  <main id="view"><div class="card"><p class="note">正在加载词库…</p></div></main>
</div>

<script>
"use strict";
const INTERVALS = [0, 1, 2, 4, 7, 15, 30, 60, 120];   // 盒子 → 间隔天数（遗忘曲线）
const KILL = 9;                                        // 斩掉的词放在第 9 盒：不再出现（正常最高到第 8 盒）
const GROUP = 10;                                      // 每 10 个词一组，组末拼写 + 小结
const COMBO_TIERS = [5, 10, 30, 50, 100];              // 连对到这些数时提示一下
const DECKS = {
  B1: { name: "B1 主线", test: w => w.lv === "B1" },
  B2: { name: "B2 进阶", test: w => w.lv === "B2" },
  C1: { name: "C1 高级", test: w => w.lv === "C1" },
  A12: { name: "A1–A2 查漏", test: w => w.lv === "A1" || w.lv === "A2" },
  JOB: { name: "求职 · IT · 办事", test: w => ["求职", "IT", "办事"].includes(w.lv) },
  ALL: { name: "全部", test: () => true },
};
const POS_ZH = { n: "名词", v: "动词", adj: "形容词", adv: "副词", prep: "介词", conj: "连词", pron: "代词", num: "数词", art: "冠词", part: "小品词", phr: "短语" };
const LS = "wortkarten", LS_SYNC = "wortkarten-sync", LS_DEV = "wortkarten-device", LS_KILLOK = "wortkarten-killok";

const S = {
  words: [], byId: new Map(), byPos: {},
  prog: {},            // id -> [box, dueDay, lapses, 修改时间ms]
  settings: { deck: "B1", newPerDay: 20, rate: 0.95, voice: "", autoplay: true, autoNext: true, sfx: true, spellNew: true, spellReview: true, similar: true },
  settingsAt: 0,
  daily: {},           // day -> { 设备id: {n: 新学, r: 复习, g: 语法题, l: 听力篇} }
  gram: {},            // 语法课 id -> {s: 最好成绩%, last: 上次%, n: 做过几遍, t: 修改时间}
  gx: {},              // 做错的语法题 "g012.3" -> [盒, 到期日, 修改时间]
  lis: {},             // 听力 id -> {s: 最好成绩%, last, d: 听写正确率%, t}
  resetAt: 0,
  view: "learn", session: null, place: null, lastAnswered: null,
  browse: { q: "", deck: "ALL", st: "", shown: 60 },
};

const today = () => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset() * 6e4) / 864e5); };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const DEV = lsGet(LS_DEV, null) || (() => { const id = "d" + Math.random().toString(36).slice(2, 8); lsSet(LS_DEV, id); return id; })();

/* ---------- 发音 ---------- */
let voices = [];
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  const score = v => (/natural|online/i.test(v.name) ? 3 : 0) + (/google/i.test(v.name) ? 2 : 0) + (v.lang === "de-DE" ? 1 : 0);
  voices = speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang)).sort((a, b) => score(b) - score(a));
}
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (S.view === "settings") render(); }; }
function speak(text, rate) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; u.rate = rate ?? S.settings.rate;
  const v = voices.find(v => v.name === S.settings.voice) || voices[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
// 单词音频：预先用神经网络语音生成，按 100 词一包懒加载；没有时退回浏览器语音
let audioIndex = {}, player = null;
const buckets = new Map();
function bucket(k) {
  if (!buckets.has(k)) buckets.set(k, fetch(`audio/b${k}.json`).then(r => r.json()).catch(() => { buckets.delete(k); return {}; }));
  return buckets.get(k);
}
function prefetch(ids) { new Set(ids.filter(id => id in audioIndex).map(id => audioIndex[id])).forEach(bucket); }
async function sayWord(w) {
  if (w.id in audioIndex) {
    const b64 = (await bucket(audioIndex[w.id]))[w.id];
    if (b64) {
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      if (player) player.pause();
      player = new Audio("data:audio/mpeg;base64," + b64);
      player.playbackRate = Math.max(0.7, Math.min(1.2, S.settings.rate / 0.95));
      player.play().catch(() => {});
      return;
    }
  }
  speak(w.art ? `${w.art} ${w.lemma}` : w.lemma);
}
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

/* ---------- 本地存储 + 合并 ---------- */
const snapshot = () => ({ v: 3, prog: S.prog, gram: S.gram, gx: S.gx, lis: S.lis, settings: S.settings, settingsAt: S.settingsAt, daily: S.daily, resetAt: S.resetAt });
function upgradeDaily(daily) {          // v1 的 {n, r} → {legacy: {n, r}}
  const out = {};
  for (const [d, v] of Object.entries(daily || {})) out[d] = typeof v?.n === "number" ? { legacy: v } : v;
  return out;
}
// 两份进度合并：每个词取修改时间更新的那份；每台设备的每日计数取较大值；设置取较新的
function merge(a, b) {
  const resetAt = Math.max(a.resetAt || 0, b.resetAt || 0);
  const prog = {};
  for (const src of [a.prog || {}, b.prog || {}])
    for (const [id, p] of Object.entries(src)) {
      if ((p[3] || 0) < resetAt) continue;
      if (!prog[id] || (p[3] || 0) > (prog[id][3] || 0)) prog[id] = p;
    }
  const daily = {};
  for (const src of [upgradeDaily(a.daily), upgradeDaily(b.daily)])
    for (const [d, devs] of Object.entries(src))
      for (const [dev, c] of Object.entries(devs || {})) {
        const cur = ((daily[d] = daily[d] || {})[dev] = daily[d][dev] || { n: 0, r: 0 });
        for (const [k, n] of Object.entries(c || {})) cur[k] = Math.max(cur[k] || 0, n || 0);
      }
  // 语法 / 听力进度：每一项取修改时间更新的那份（和单词一样）
  const keyed = (x, y, ts) => {
    const out = {};
    for (const src of [x || {}, y || {}])
      for (const [k, v] of Object.entries(src)) { const t = ts(v) || 0; if (t < resetAt) continue; if (!out[k] || t > (ts(out[k]) || 0)) out[k] = v; }
    return out;
  };
  const newer = (b.settingsAt || 0) > (a.settingsAt || 0) ? b : a;
  return { v: 3, prog, daily, resetAt, gram: keyed(a.gram, b.gram, v => v.t), gx: keyed(a.gx, b.gx, v => v[2]), lis: keyed(a.lis, b.lis, v => v.t),
    settings: { ...a.settings, ...newer.settings }, settingsAt: Math.max(a.settingsAt || 0, b.settingsAt || 0) };
}
function adopt(d) {
  const m = merge(snapshot(), d || {});
  S.prog = m.prog; S.daily = m.daily; S.resetAt = m.resetAt; S.settings = { ...S.settings, ...m.settings }; S.settingsAt = m.settingsAt;
  S.gram = m.gram; S.gx = m.gx; S.lis = m.lis;
}
function saveLocal() { lsSet(LS, snapshot()); }
function setProg(id, p) { S.prog[id] = [p[0], p[1], p[2] || 0, Date.now()]; }
function setSetting(k, v) { S.settings[k] = v; S.settingsAt = Date.now(); touch(); }
function touch() { saveLocal(); scheduleSync(); }
const dayTotal = d => Object.values(S.daily[d] || {}).reduce((t, c) => ({ n: t.n + (c.n || 0), r: t.r + (c.r || 0), g: t.g + (c.g || 0), l: t.l + (c.l || 0) }), { n: 0, r: 0, g: 0, l: 0 });
function bumpDaily(k) { const d = today(); const dev = ((S.daily[d] = S.daily[d] || {})[DEV] = S.daily[d][DEV] || { n: 0, r: 0 }); dev[k] = (dev[k] || 0) + 1; }

/* ---------- 多设备同步：私密 GitHub Gist ---------- */
const GIST_FILE = "wortkarten-progress.json", GIST_DESC = "Wortkarten 学习进度（自动同步，勿删）";
let syncCfg = lsGet(LS_SYNC, {}), syncTimer = null, syncBusy = null, syncState = { kind: "", text: "" };
function setSyncState(kind, text) {
  syncState = { kind, text };
  const dot = $("#dot"); if (dot) dot.className = "syncdot " + kind;
  const el = $("#sync"); if (el) el.textContent = text;
}
async function gh(path, opts = {}) {
  const r = await fetch("https://api.github.com" + path, { ...opts, cache: "no-store",
    headers: { Authorization: "Bearer " + syncCfg.token, Accept: "application/vnd.github+json", "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) throw new Error("token 无效或已过期，请重新填写");
  if (r.status === 403 || r.status === 404) throw new Error(r.status === 404 ? "找不到同步用的 Gist（是不是删了？）" : "token 没有 Gist 权限");
  if (!r.ok) throw new Error("GitHub 返回 " + r.status);
  return r.json();
}
async function findOrCreateGist() {
  for (let page = 1; page <= 5; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const hit = list.find(g => g.files && g.files[GIST_FILE]);
    if (hit) return hit.id;
    if (list.length < 100) break;
  }
  const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: JSON.stringify(snapshot()) } } }) });
  return g.id;
}
async function readGist(id) {
  const g = await gh(`/gists/${id}`);
  const f = g.files[GIST_FILE];
  if (!f) return null;
  const txt = f.truncated ? await (await fetch(f.raw_url, { cache: "no-store" })).text() : f.content;
  return JSON.parse(txt);
}
function syncNow() {
  if (!syncCfg.token) { setSyncState("", "未开启同步：进度只存在这台设备上"); return Promise.resolve(); }
  if (syncBusy) return syncBusy.then(() => syncNow());
  clearTimeout(syncTimer);
  setSyncState("busy", "正在同步…");
  syncBusy = (async () => {
    try {
      if (!syncCfg.gistId) { syncCfg.gistId = await findOrCreateGist(); lsSet(LS_SYNC, syncCfg); }
      const before = JSON.stringify(snapshot());
      const remote = await readGist(syncCfg.gistId);
      if (remote) adopt(remote);
      const merged = JSON.stringify(snapshot());
      saveLocal();
      if (!remote || JSON.stringify(merge(remote, remote)) !== JSON.stringify(merge(snapshot(), snapshot())))
        await gh(`/gists/${syncCfg.gistId}`, { method: "PATCH", body: JSON.stringify({ files: { [GIST_FILE]: { content: merged } } }) });
      syncCfg.last = Date.now(); lsSet(LS_SYNC, syncCfg);
      setSyncState("ok", "已同步 " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }));
      if (merged !== before && S.view !== "learn") render();
      if (merged !== before && S.view === "learn" && (!S.session?.current || S.session.current.answered === false && S.session.done === 0)) { S.session = null; render(); }
    } catch (e) {
      setSyncState("err", "同步失败：" + (e.message || "网络问题") + "（进度已存本机，联网后会再试）");
    } finally { syncBusy = null; }
  })();
  return syncBusy;
}
function scheduleSync() { if (!syncCfg.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 6000); }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { saveLocal(); if (syncCfg.token) syncNow(); }
  else if (syncCfg.token && Date.now() - (syncCfg.last || 0) > 30000) syncNow();
});
window.addEventListener("online", () => syncCfg.token && syncNow());

/* ---------- 题目 ---------- */
// 题型参考百词斩德语书的题型（DE_ 系列）：例句选义、看词选义、听音选词、中文选词、拼写；再加德语自己的 der/die/das 和 haben/sein
const isLearning = id => S.prog[id] && S.prog[id][0] >= 1;
const isKilled = id => S.prog[id]?.[0] === KILL;
const spellable = w => /^[A-Za-zÄÖÜäöüß-]{2,24}$/.test(w.lemma);
// 词形相似度（字母二元组 Dice 系数），用来挑“形近易混”的干扰项
const bgCache = new Map();
function bigrams(s) {
  if (!bgCache.has(s)) { const t = ` ${s.toLowerCase()} `, out = new Set(); for (let i = 0; i < t.length - 1; i++) out.add(t.slice(i, i + 2)); bgCache.set(s, out); }
  return bgCache.get(s);
}
function likeness(a, b) { const A = bigrams(a), B = bigrams(b); let n = 0; for (const x of A) if (B.has(x)) n++; return 2 * n / (A.size + B.size); }
function distractors(w, n, key) {
  if (key === "de" && S.settings.similar) {
    const used = new Set([w.lemma.toLowerCase()]), out = [];
    const near = S.words.filter(c => c.id !== w.id && !used.has(c.lemma.toLowerCase()) && !isKilled(c.id))
      .map(c => [likeness(w.lemma, c.lemma), c]).sort((a, b) => b[0] - a[0]).slice(0, 12).map(x => x[1]);
    for (const c of shuffle(near)) { const k = c.lemma.toLowerCase(); if (used.has(k)) continue; used.add(k); out.push(c); if (out.length === n) return out; }
  }
  const pool = S.byPos[w.pos] && S.byPos[w.pos].length > 20 ? S.byPos[w.pos] : S.words;
  const out = [], used = new Set([key === "de" ? w.lemma.toLowerCase() : w[key]]);
  let guard = 0;
  while (out.length < n && guard++ < 400) {
    const c = pool[Math.random() * pool.length | 0];
    const v = key === "de" ? c.lemma.toLowerCase() : c[key];
    if (!v || used.has(v) || c.id === w.id) continue;
    used.add(v); out.push(c);
  }
  return out;
}
const deLabel = w => (w.art ? w.art + " " : "") + w.lemma;
// 在例句里找到这个词（含变位、复数、分开的前缀动词词干），返回 [例句, 起, 止]
function findInSentence(w) {
  if ("_sent" in w) return w._sent;
  w._sent = null;
  const lem = w.lemma.toLowerCase().replace(/^sich /, "");
  if (/[ ,()\/.]/.test(lem)) return null;
  const stem = lem.replace(/(en|n|e)$/, "");
  const forms = new Set([(w.p2 || ""), ...(w.forms || "").split(/[ ,]+/), (w.pl_full || "").replace(/^die /, "")].map(x => x.toLowerCase()).filter(x => x.length >= 4));
  forms.add(lem);
  for (const ex of w.ex || []) {
    const re = /[A-Za-zÄÖÜäöüß]+/g; let m;
    while ((m = re.exec(ex))) {
      const t = m[0].toLowerCase();
      if (forms.has(t) || (stem.length >= 4 && t.startsWith(stem)) || (stem.length >= 5 && t.includes(stem))) return (w._sent = [ex, m.index, m.index + m[0].length]);
    }
  }
  return null;
}
// 新词第一天的三步（百词斩：例句 → 看词/听音 → 回想，每步答对才进下一步）
function roadmap(w) {
  const r = [findInSentence(w) ? "sentence" : "meaning", "audio"];
  if (w.art && ["der", "die", "das"].includes(w.art)) r.push("gender");
  else if (w.aux && w.p2) r.push("aux");
  else r.push("reverse");
  return r;
}
function typesFor(w) {
  const t = ["meaning", "reverse", "audio"], box = S.prog[w.id]?.[0] || 0;
  if (findInSentence(w)) t.push("sentence");
  if (box >= 2) t.push("listen");
  if (w.art && ["der", "die", "das"].includes(w.art)) t.push("gender");
  if (w.aux && w.p2) t.push("aux");
  if (S.settings.spellReview && box >= 2 && spellable(w)) t.push("spell", "spell");
  return t;
}
function makeQ(id, type) {
  const w = S.byId.get(id);
  if (type === "sentence" && !findInSentence(w)) type = "meaning";
  if (type === "spell" && !spellable(w)) type = "reverse";
  const q = { id, type, w, answered: false, tried: [], wrongs: 0 };
  if (type === "meaning" || type === "listen" || type === "sentence") {
    q.opts = shuffle([w, ...distractors(w, 3, "zh")]).map(x => ({ label: x.zh, right: x.id === w.id, de: false }));
    if (type === "sentence") q.sent = findInSentence(w);
  } else if (type === "reverse" || type === "audio") {
    q.opts = shuffle([w, ...distractors(w, 3, "de")]).map(x => ({ label: deLabel(x), right: x.id === w.id, de: true }));
  } else if (type === "gender") {
    q.opts = ["der", "die", "das"].map(a => ({ label: a, right: a === w.art, cls: a }));
  } else if (type === "aux") {
    q.opts = ["hat", "ist"].map(a => ({ label: a, right: a === w.aux }));
  } else q.opts = [];
  return q;
}

/* ---------- 学习会话：复习在前（最弱的先），新词在后；每 10 个词一组，组末拼写新词 + 小结 ---------- */
let advTimer = null;
function buildSession() {

    .sort((a, b) => a[1][0] - b[1][0] || a[1][1] - b[1][1] || hash(a[0]) - hash(b[0])).map(([id]) => id);
  const doneNew = dayTotal(d).n;
  const deck = DECKS[S.settings.deck] || DECKS.B1;
  const fresh = S.words.filter(w => deck.test(w) && !isLearning(w.id))
    .sort((a, b) => ((S.prog[b.id] ? 1 : 0) - (S.prog[a.id] ? 1 : 0)) || (hash(a.id) - hash(b.id)))  // 摸底标“不认识”的优先
    .slice(0, Math.max(0, S.settings.newPerDay - doneNew)).map(w => w.id);
  const queue = due.map(id => { const ts = typesFor(S.byId.get(id)); return { id, type: ts[Math.random() * ts.length | 0], kind: "review" }; });
  fresh.forEach(id => { const road = roadmap(S.byId.get(id)); queue.push({ id, type: road[0], kind: "new", stage: 0, road }); });

}
function setCurrent(item) {

}

    <div class="actions" style="margin:0"><button type="button" class="btn primary" data-act="killok">斩</button><button type="button" class="btn ghost" data-act="fbclose">取消</button></div>`);
  clearTimeout(advTimer);

function wordDiff(typed, right) {
  const re = /[0-9A-Za-zÄÖÜäöüßÀ-ÿ]+(?:['-][0-9A-Za-zÄÖÜäöüßÀ-ÿ]+)*/g;
  const A = (typed.match(re) || []).map(x => x.toLowerCase()), Bm = [...right.matchAll(re)], B = Bm.map(m => m[0].toLowerCase());
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const keep = new Set(); let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { keep.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  let html = "", last = 0;
  Bm.forEach((mm, k) => { html += esc(right.slice(last, mm.index)) + (keep.has(k) ? esc(mm[0]) : `<span class="x">${esc(mm[0])}</span>`); last = mm.index + mm[0].length; });
  return { ok: keep.size, n: m, html: html + esc(right.slice(last)) };
}

  const d = t.dataset;
  if (d.glv) { TABS.g = d.glv; lsSet(LS_TABS, TABS); return render(); }
  if (d.llv) { TABS.l = d.llv; lsSet(LS_TABS, TABS); return render(); }
  if (d.gopt) return gPick(+d.gopt);
  if (d.place || d.unplace) {
    const c = GV.run && curEx(GV.run); if (!c || c.done) return;
    if (d.place) c.placed.push(+d.place); else c.placed.splice(+d.unplace, 1);
    return rePractice();
  }
  if (d.lq) { if (LV.checked) return; LV.ans[+d.lq] = +d.k; return reL(); }
  if (d.lmode) { LV.mode = d.lmode; if (LV.mode === "d" && LV.dres == null && LV.di === 0) lStop(); return render(); }
  const ga = d.act;
  if (ga === "gback" || ga === "lback") return navBack();
  if (ga === "greview") return startReview();
  if (ga === "gtopractice") return $("#practice")?.scrollIntoView({ behavior: "smooth", block: "start" });
  if (ga === "gcheck") return gCheck();
  if (ga === "gnext") return gNext();
  if (ga === "gskip") return gSkip();
  if (ga === "gclear") { const c = curEx(GV.run); c.placed = []; return rePractice(); }
  if (ga === "gredo") { const r = GV.run; GV.run = newRun(r.results.filter(x => !x.right).map(({ tid, i }) => ({ tid, i })), r.review, true); return rePractice(true); }
  if (ga === "gagain") { const tid = GV.run.items[0].tid; GV.run = newRun(GRid.get(tid).ex.map((_, i) => ({ tid, i })), false, false); return rePractice(true); }
  if (ga === "gfb") return gFeedback();
  if (ga === "ltoggle") return lToggle();
  if (ga === "lprev") return lStep(-1);
  if (ga === "lnext") return lStep(1);
  if (ga === "lrep") return lPlay(Math.max(0, LV.cur), true);
  if (ga === "lshow") { LV.show = true; return render(); }
  if (ga === "lzh") { LV.zh = !LV.zh; $("#ltr .tr")?.classList.toggle("nozh", !LV.zh); t.textContent = LV.zh ? "隐藏中文" : "显示中文"; return; }
  if (ga === "lcheck") return lCheck();
  if (ga === "lretry") { LV.ans = {}; LV.qo = {}; LV.checked = false; return render(); }
  if (ga === "ldplay") return lPlay(LV.di, true);
  if (ga === "ldslow") return lPlay(LV.di, true, 0.7);
  if (ga === "ldcheck") return ldCheck(false);
  if (ga === "ldskip") return ldCheck(true);
  if (ga === "ldnext") return ldNext();
  if (ga === "ldrestart") { LV.di = 0; LV.dv = ""; LV.dres = null; LV.dsum = []; reL(); return lPlay(0, true); }
  if (ga === "lfb") return lFeedback();
  const fa = t.dataset.act;
  if (fa === "fb") return openFb(t.dataset.id);
  if (fa === "fbtype") { fb.text = $("#fbtext")?.value || ""; fb.type = t.dataset.t; return renderFb(); }
  if (fa === "fbsend") return submitFb();
  if (fa === "fbclose") { fb = null; return renderFb(); }
  if (fa === "sayid") { const w = S.byId.get(t.dataset.id); if (w) sayWord(w); return; }
  if (fa === "killok") { lsSet(LS_KILLOK, true); fb = null; renderFb(); return kill(true); }
  if (fa === "killid" || fa === "unkill") {
    const id = t.dataset.id, p = S.prog[id];
    setProg(id, fa === "killid" ? [KILL, 0, p?.[2] || 0] : [0, today(), p?.[2] || 0]);   // 撤销后回到“待学”，优先排进新词
    touch(); openWord(id);
    if (S.view !== "learn") render();
    return;
  }
  if (t.dataset.ch) {                 // 拼写 / 填空 / 听写：插入变音字母
    const inp = lastInput && document.contains(lastInput) && !lastInput.readOnly ? lastInput
      : $("#spell:not([readonly])") || $("[data-gap]:not([readonly])") || $("#dict:not([readonly])");
    if (!inp) return;
    const a0 = inp.selectionStart ?? inp.value.length, a1 = inp.selectionEnd ?? a0;
    inp.value = inp.value.slice(0, a0) + t.dataset.ch + inp.value.slice(a1);
    inp.focus(); inp.setSelectionRange(a0 + 1, a0 + 1);
    inp.dispatchEvent(new Event("input", { bubbles: true }));
    return;
  }
  if (t.dataset.v) return go(t.dataset.v);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.opt) return answer(+t.dataset.opt);
  if (t.dataset.say) return speak(t.dataset.say, Math.min(S.settings.rate, 0.9));
  const act = t.dataset.act;
  if (act === "say") {
    const w = S.view === "place" ? S.byId.get(S.place.pool[S.place.i]) : S.session?.current?.w;
    if (w) sayWord(w);
  } else if (act === "next") next();
  else if (act === "kill") kill(false);
  else if (act === "hint") { const q = S.session?.current; if (q && !q.answered) { q.hint = true; render(); } }
  else if (act === "skip") skip();
  else if (act === "hold") { clearTimeout(advTimer); const q = S.session?.current; if (q) { q.auto = false; render(); } }
  else if (act === "spellok") checkSpell();
  else if (act === "sumhide") { S.session.sumHide = !S.session.sumHide; render(); }
  else if (act === "sumnext") sumNext();
  else if (act === "more") { setSetting("newPerDay", S.settings.newPerDay + 10); S.session = null; render(); autoSay(); }
  else if (act === "reveal") { S.place.show = true; render(); }
  else if (act === "known") placeMark(true);
  else if (act === "unknown") placeMark(false);
  else if (act === "showmore") { S.browse.shown += 100; render(); }
  else if (act === "testvoice") { const w = S.words.find(x => x.lemma === "Bewerbung"); if (w) sayWord(w); setTimeout(() => speak("Ich bewerbe mich um die Stelle als Softwareentwickler."), 1200); }
  else if (act === "syncon") {
    const tok = ($("#stoken")?.value || "").trim();
    if (!/^(ghp_|github_pat_|gho_)/.test(tok)) { setSyncState("err", "看起来不是 GitHub token（应以 ghp_ 开头）"); return; }
    syncCfg = { token: tok }; lsSet(LS_SYNC, syncCfg); render(); syncNow().then(() => render());
  }
  else if (act === "syncnow") syncNow();
  else if (act === "syncoff") { syncCfg = {}; lsSet(LS_SYNC, syncCfg); setSyncState("", "已关闭同步：进度只存在这台设备上"); render(); }
  else if (act === "reset") { $("#resetbox").innerHTML = `<span class="note">确定清空？所有设备上的进度都会清空，无法撤销。</span><button class="btn" data-act="reset2" style="border-color:var(--bad);color:var(--bad)">确定清空</button><button class="btn ghost" data-act="cancel">取消</button>`; }
  else if (act === "reset2") { S.prog = {}; S.daily = {}; S.gram = {}; S.gx = {}; S.lis = {}; S.resetAt = Date.now(); S.session = null; touch(); syncNow(); render(); }
  else if (act === "cancel") render();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "deck") { setSetting("deck", t.value); S.session = null; render(); autoSay(); }
  else if (t.id === "bdeck") { S.browse.deck = t.value; S.browse.shown = 60; render(); }
  else if (t.id === "bst") { S.browse.st = t.value; S.browse.shown = 60; render(); }
  else if ({ sautonext: 1, sspelln: 1, sspellr: 1, ssim: 1, ssfx: 1 }[t.id]) setSetting({ sautonext: "autoNext", sspelln: "spellNew", sspellr: "spellReview", ssim: "similar", ssfx: "sfx" }[t.id], t.checked);
  else if (t.id === "snew") { setSetting("newPerDay", +t.value); S.session = null; }
  else if (t.id === "svoice") setSetting("voice", t.value);
  else if (t.id === "sauto") setSetting("autoplay", t.checked);
  else if (t.id === "srate") setSetting("rate", +t.value);
  else if (t.id === "lrate") { setSetting("lrate", +t.value); if (la) la.playbackRate = +t.value; }
});
document.addEventListener("focusin", e => { if (e.target.matches?.("#spell, [data-gap], #dict")) lastInput = e.target; });
document.addEventListener("input", e => {
  if (e.target.dataset?.gap != null) { const c = GV.run && GV.run.k < GV.run.items.length && curEx(GV.run); if (c && !c.done) c.vals[+e.target.dataset.gap] = e.target.value; }
  if (e.target.id === "dict" && !LV.dres) LV.dv = e.target.value;
  if (e.target.id === "bq") { S.browse.q = e.target.value; S.browse.shown = 60; const pos = e.target.selectionStart; render(); const i = $("#bq"); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === "srate") { const r = $("#ratev"); if (r) r.textContent = (+e.target.value).toFixed(2); }
});
document.addEventListener("keydown", e => {
  if ($("#fbsheet")) { if (e.key === "Escape") { fb = null; renderFb(); } return; }
  if (e.target.id === "spell" && e.key === "Enter") { e.preventDefault(); return checkSpell(); }
  if (e.key === "Enter" && e.target.matches("[data-gap]")) { e.preventDefault(); const c = GV.run && curEx(GV.run); return c?.done ? gNext() : gCheck(); }
  if (e.key === "Enter" && e.target.id === "dict") { e.preventDefault(); return LV.dres ? ldNext() : ldCheck(false); }
  if (e.target.matches("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.view === "grammar" && GV.run && GV.run.k < GV.run.items.length && (GV.tid || GV.run.review)) {
    const c = curEx(GV.run);
    if (!c.done && c.ex.t === "mc" && /^[1-4]$/.test(e.key) && +e.key <= c.opts.length) { e.preventDefault(); return gPick(+e.key - 1); }
    if (e.key === "Enter") { e.preventDefault(); return c.done ? gNext() : gCheck(); }
    return;
  }
  if (S.view === "listen" && LV.id) {
    if (e.key === " ") { e.preventDefault(); return lToggle(); }
    if (e.key === "Enter" && LV.mode === "d" && LV.dres) { e.preventDefault(); return ldNext(); }
    return;
  }
  if (S.view === "learn" && S.session?.summary) { if (e.key === "Enter") { e.preventDefault(); sumNext(); } return; }
  if (S.view === "learn" && S.session?.current) {
    const q = S.session.current;
    if (!q.answered && /^[1-4]$/.test(e.key) && +e.key <= q.opts.length) { e.preventDefault(); answer(+e.key - 1); }
    else if (q.answered && e.key === "Enter") { e.preventDefault(); next(); }
    else if (e.key === " ") { e.preventDefault(); sayWord(q.w); }
  } else if (S.view === "place" && S.place && S.place.i < S.place.pool.length) {
    if (e.key === "ArrowRight") { e.preventDefault(); placeMark(true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); placeMark(false); }
    else if (e.key === "ArrowDown") { e.preventDefault(); S.place.show = true; render(); }
    else if (e.key === " ") { e.preventDefault(); sayWord(S.byId.get(S.place.pool[S.place.i])); }
  }
});

/* ---------- 自动更新（和送报 App 一样：打开/切回前台时检查新版本） ---------- */
const APP_VERSION = "2026-11-10.2";
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded || !navigator.serviceWorker.controller) return;
    reloaded = true; saveLocal(); location.reload();
  });
}

/* ---------- 启动 ---------- */
(async function start() {
  const local = lsGet(LS, null);
  if (local) adopt(local);
  setSyncState("", syncCfg.token ? "等待同步…" : "未开启同步：进度只存在这台设备上");
  try {
    S.words = await (await fetch("words.json")).json();
  } catch {
    $("#view").innerHTML = `<div class="card"><p>词库没加载出来，联网后刷新再试一次。</p></div>`;
    return;
  }
  for (const w of S.words) { S.byId.set(w.id, w); (S.byPos[w.pos] = S.byPos[w.pos] || []).push(w); }
  try { audioIndex = await (await fetch("audio/index.json")).json(); } catch {}
  fetch("changelog.json", { cache: "no-cache" }).then(r => r.json()).then(c => { changelog = c; updLogDot(); if (S.view === "log") render(); }).catch(() => {});
  flushOutbox();
  if (syncCfg.token) await Promise.race([syncNow(), new Promise(r => setTimeout(r, 4000))]);  // 先拉一次再出题，最多等 4 秒
  render();
})();
</script>
